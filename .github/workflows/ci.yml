# HouseholdBook CI
# - android: 디버그 빌드 + 단위 테스트 + R8 출시 빌드(디버그 키 서명) 확인
# - firestore-rules: Firebase 에뮬레이터에서 firestore.rules 보안 규칙 테스트
# google-services.json, keystore.properties는 저장소에 없으므로 CI는 로컬 전용 모드·디버그 키로 빌드합니다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties의 toolchainVersion(25)과 맞춤
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: 디버그 빌드 + 단위 테스트
        run: ./gradlew assembleDebug testDebugUnitTest assembleDebugAndroidTest --stacktrace

      - name: 출시 빌드 (R8)
        run: ./gradlew assembleRelease --stacktrace

      - name: 단위 테스트 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Room 스키마 변경 누락 확인
        # 엔티티를 바꾸고 app/schemas/의 JSON을 커밋하지 않으면 실패
        run: git diff --exit-code -- app/schemas/

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Firestore 에뮬레이터 실행용
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 의존성 설치
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: 보안 규칙 테스트
        run: npm test
